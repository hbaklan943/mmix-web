<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mmix-web</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="vendor/codemirror/codemirror.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>MMIX</h1>
  <div class="toolbar">
    <select id="examples" title="example programs"></select>
    <button id="btn-assemble" disabled>Assemble</button>
    <button id="btn-run" disabled>Run</button>
    <button id="btn-share" disabled>Share</button>
    <label class="opt"><input type="checkbox" id="opt-trace"> Trace</label>
    <label class="opt"><input type="checkbox" id="opt-profile"> Profile</label>
    <label class="opt"><input type="checkbox" id="opt-stats"> Stats</label>
    <span id="status"></span>
  </div>
</header>
<main>
  <section id="editor-pane">
    <div id="tab-bar" class="tab-bar">
      <button id="btn-new-tab" title="New tab">+</button>
    </div>
    <textarea id="editor" spellcheck="false" placeholder="Loading editor…"></textarea>
  </section>
  <section id="side-pane">
    <div class="pane-label">Assembler messages</div>
    <div id="asm-output" class="console"></div>
    <div class="pane-label">Simulator output</div>
    <div id="sim-output" class="console"></div>
    <details id="regs" class="regs">
      <summary>Registers (after run)</summary>>
      <div class="mem-read">
        <input id="mem-addr" spellcheck="false" placeholder="read tetra at 0x…">
        <button id="btn-mem" disabled>Read</button>
        <span id="mem-result"></span>
      </div>
      <pre id="reg-output" class="console"></pre>
    </details>
    <details id="files" class="regs">
      <summary>Files in virtual FS (after run)</summary>
      <input type="file" id="file-upload" multiple>
      <div id="file-list" class="console"></div>
    </details>
    <div class="pane-label">Program input (stdin)</div>
    <textarea id="stdin" spellcheck="false" placeholder="Optional — fed to the program as standard input"></textarea>
  </section>
</main>
<script src="vendor/codemirror/codemirror.min.js"></script>
<script src="vendor/codemirror/simple.min.js"></script>
<script src="app.js"></script>
</body>
</html>
